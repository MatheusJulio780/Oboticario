<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minha Conta | O Boticário</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #e0e5ec;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --primary: #07c2b2;
            --success: #00b894;
            --danger: #d63031;
            --warning: #fca311;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --neu-out: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            --neu-in: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .card {
            background: var(--bg);
            box-shadow: var(--neu-out);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .debt-highlight {
            text-align: center;
        }

        .total-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--danger);
            margin: 10px 0;
        }

        .installment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-radius: 16px;
            background: var(--bg);
            box-shadow: var(--neu-out);
            margin-bottom: 15px;
            border: 1px solid transparent;
        }

        .installment-item.atrasada {
            border-color: rgba(214, 48, 49, 0.2);
        }

        .inst-info strong {
            display: block;
            font-size: 1rem;
        }

        .inst-info span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-pdf {
            background: var(--bg);
            box-shadow: var(--neu-out);
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            color: var(--primary);
            font-weight: 800;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .btn-pdf:active {
            box-shadow: var(--neu-in);
        }

        .btn-pdf:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
    </style>
</head>

<body>

    <div id="loading-overlay">Carregando seus dados...</div>

    <div class="container">
        <div class="header">
            <i class="fa-solid fa-droplet" style="color: var(--primary); font-size: 2.5rem; margin-bottom: 10px;"></i>
            <h1>Olá, <span id="client-name">Cliente</span></h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Painel de Conferência O Boticário</p>
        </div>

        <div class="card debt-highlight">
            <div class="section-title"><i class="fa-solid fa-triangle-exclamation"></i> Total Pendente</div>
            <div class="total-value" id="total-pendente">R$ 0,00</div>
            <p style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted);">Somatória de todas as suas
                parcelas abertas.</p>
        </div>

        <div class="section-title"><i class="fa-solid fa-calendar-days"></i> Minhas Próximas Parcelas</div>
        <div id="lista-parcelas"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCi03g667vB1uOT1zsuDc1AkiyQ1b8o0GQ", authDomain: "oboticario-e8369.firebaseapp.com", projectId: "oboticario-e8369" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // MOTOR DE AUTO-INJEÇÃO HTML2CANVAS
        async function loadHtml2Canvas() {
            if (window.html2canvas) return window.html2canvas;
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
                script.onload = () => resolve(window.html2canvas);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // FUNÇÕES UTILITÁRIAS E DE CÁLCULO
        function adicionarMeses(dataISO, meses) {
            if (!dataISO) return null;
            const [ano, mes, dia] = dataISO.split('-');
            const dt = new Date(ano, parseInt(mes) - 1 + meses, dia);
            return dt.toISOString().split('T')[0];
        }

        function formatarDataBR(dataISO) { return dataISO ? dataISO.split('-').reverse().join('/') : '--'; }

        function calcularDias(dataAlvoISO) {
            if (!dataAlvoISO) return { texto: '--', atrasado: false, dias: 0 };
            const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
            const [ano, mes, dia] = dataAlvoISO.split('-'); const alvo = new Date(ano, mes - 1, dia);
            const diffDays = Math.ceil((alvo - hoje) / (1000 * 60 * 60 * 24));
            if (diffDays < 0) return { texto: `${Math.abs(diffDays)} d atrasados`, atrasado: true, dias: diffDays };
            if (diffDays === 0) return { texto: `Vence HOJE`, atrasado: false, dias: 0 };
            return { texto: `Vence em ${diffDays} d`, atrasado: false, dias: diffDays };
        }

        // CARREGAMENTO DA TELA PRINCIPAL
        async function carregarDadosCliente() {
            const urlParams = new URLSearchParams(window.location.search);
            const nomeCliente = urlParams.get('c');

            if (!nomeCliente) {
                document.body.innerHTML = "<div style='text-align:center; padding:50px;'>Cliente não identificado na URL.</div>";
                return;
            }

            const nomeFormatado = nomeCliente.replace(/_/g, ' ');
            document.getElementById('client-name').innerText = nomeFormatado;

            const [vSnap, pgSnap] = await Promise.all([
                getDocs(query(collection(db, "vendas_clientes"), where("cliente", "==", nomeFormatado))),
                getDocs(query(collection(db, "pagamentos_recebidos"), where("cliente", "==", nomeFormatado)))
            ]);

            let totalPendenteGlobal = 0;
            const pagamentosMap = {};

            pgSnap.forEach(d => {
                const pg = d.data();
                const chave = `${pg.cod_pedido}_p${pg.parcela}`;
                pagamentosMap[chave] = (pagamentosMap[chave] || 0) + pg.valor_pago;
            });

            const caixas = {};
            vSnap.forEach(d => {
                const v = d.data();
                if (!caixas[v.cod_pedido]) { caixas[v.cod_pedido] = { total: 0, parcelas: v.parcelas, venc: v.venc_cliente }; }
                if (v.parcelas > caixas[v.cod_pedido].parcelas) { caixas[v.cod_pedido].parcelas = v.parcelas; }
                caixas[v.cod_pedido].total += parseFloat(v.valor_venda);
            });

            const listaHTML = document.getElementById('lista-parcelas');
            listaHTML.innerHTML = '';
            let pendenciasAtivas = 0;

            for (const cod in caixas) {
                const c = caixas[cod];
                const valorParcela = c.total / c.parcelas;

                for (let i = 1; i <= c.parcelas; i++) {
                    const dataVenc = adicionarMeses(c.venc, i - 1);
                    const pago = pagamentosMap[`${cod}_p${i}`] || 0;
                    const saldo = valorParcela - pago;

                    if (saldo > 0.1) {
                        pendenciasAtivas++;
                        totalPendenteGlobal += saldo;
                        const hoje = new Date().toISOString().split('T')[0];
                        const estaAtrasada = dataVenc < hoje;

                        listaHTML.innerHTML += `
                            <div class="installment-item ${estaAtrasada ? 'atrasada' : ''}">
                                <div class="inst-info">
                                    <strong>${i}ª Parcela - Caixa #${cod}</strong>
                                    <span style="${estaAtrasada ? 'color:var(--danger)' : ''}">
                                        Vencimento: ${formatarDataBR(dataVenc)} ${estaAtrasada ? '(Atrasada)' : ''}
                                    </span>
                                </div>
                                <div style="text-align:right;">
                                    <div style="font-weight:800; font-size:1.1rem; margin-bottom: 6px;">R$ ${saldo.toFixed(2)}</div>
                                    <button class="btn-pdf" onclick="window.gerarReciboVisual('${cod}', this)">
                                        <i class="fa-solid fa-image"></i> Ver Recibo
                                    </button>
                                </div>
                            </div>
                        `;
                    }
                }
            }

            if (pendenciasAtivas === 0) {
                listaHTML.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--success); font-weight: bold;"><i class="fa-solid fa-check-circle" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i> Parabéns! Nenhuma pendência ativa.</div>`;
            }

            document.getElementById('total-pendente').innerText = `R$ ${totalPendenteGlobal.toFixed(2)}`;
            document.getElementById('loading-overlay').style.display = 'none';
        }

        window.gerarReciboVisual = async (codPedido, btnElement) => {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';
            btnElement.disabled = true;

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const clienteParam = urlParams.get('c');
                const cliente = clienteParam ? clienteParam.replace(/_/g, ' ') : 'Cliente';

                const pedidoDoc = await getDoc(doc(db, "pedidos_marca", codPedido));
                const pedido = pedidoDoc.exists() ? pedidoDoc.data() : null;

                const vSnap = await getDocs(query(collection(db, "vendas_clientes"), where("cod_pedido", "==", codPedido), where("cliente", "==", cliente)));
                const pgSnap = await getDocs(query(collection(db, "pagamentos_recebidos"), where("cod_pedido", "==", codPedido), where("cliente", "==", cliente)));

                let totalVendaOriginal = 0, maxParcelas = 1, venc1 = '', htmlItens = '', qtd = 0;
                
                vSnap.forEach(d => {
                    const v = d.data();
                    qtd++; const val = parseFloat(v.valor_venda) || 0; totalVendaOriginal += val;
                    if (v.parcelas > maxParcelas) maxParcelas = v.parcelas; venc1 = v.venc_cliente;
                    const valCondicao = v.parcelas > 1 ? `R$ ${(val / v.parcelas).toFixed(2)}` : 'À Vista';
                    const strParcela = v.parcelas > 1 ? `${v.parcelas}X` : '1X';
                    
                    htmlItens += `
                        <div style="display:flex; justify-content:space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9;">
                            <div style="flex:1;">
                                <div style="font-size:12px; color:#64748b;">${v.cod_produto}</div>
                                <div style="font-size:14px; color:#0f172a; font-weight:600;">${v.nome_item}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-size:14px; color:#0f172a; font-weight:800;">R$ ${val.toFixed(2)}</div>
                                <div style="font-size:12px; color:#64748b;">${strParcela} (${valCondicao})</div>
                            </div>
                        </div>
                    `;
                });

                let pago_p1 = 0, pago_p2 = 0, pago_p3 = 0;
                pgSnap.forEach(d => {
                    const pg = d.data();
                    if (pg.parcela === 1) pago_p1 += parseFloat(pg.valor_pago);
                    if (pg.parcela === 2) pago_p2 += parseFloat(pg.valor_pago);
                    if (pg.parcela === 3) pago_p3 += parseFloat(pg.valor_pago);
                });

                const valBaseP1 = maxParcelas >= 1 ? (totalVendaOriginal / maxParcelas) : totalVendaOriginal;
                const valBaseP2 = maxParcelas >= 2 ? (totalVendaOriginal / maxParcelas) : 0;
                const valBaseP3 = maxParcelas === 3 ? (totalVendaOriginal / maxParcelas) : 0;

                const venc2 = maxParcelas >= 2 ? adicionarMeses(venc1, 1) : null;
                const venc3 = maxParcelas === 3 ? adicionarMeses(venc1, 2) : null;

                const statusV1 = calcularDias(venc1);
                const statusV2 = calcularDias(venc2);
                const statusV3 = calcularDias(venc3);

                const calcularEncargos = (valorBase, jaPago, status) => {
                    if (jaPago >= (valorBase - 0.1)) return { total: 0, juros: 0, multa: 0, devedor: 0 };
                    if (!status.atrasado) return { total: valorBase - jaPago, juros: 0, multa: 0, devedor: valorBase - jaPago };
                    const dias = Math.abs(status.dias); const multa = 5.93; const juros = dias * 0.89; const devOriginal = valorBase - jaPago;
                    return { total: devOriginal + multa + juros, multa: multa, juros: juros, devedorOriginal: devOriginal };
                };

                const encargosP1 = calcularEncargos(valBaseP1, pago_p1, statusV1);
                const encargosP2 = calcularEncargos(valBaseP2, pago_p2, statusV2);
                const encargosP3 = calcularEncargos(valBaseP3, pago_p3, statusV3);

                let colorP1 = '#64748b', colorP2 = '#64748b', colorP3 = '#64748b';
                if (pago_p1 >= (valBaseP1 - 0.1)) colorP1 = '#16a34a'; else if (statusV1.atrasado) colorP1 = '#dc2626';
                if (maxParcelas >= 2) { if (pago_p2 >= (valBaseP2 - 0.1)) colorP2 = '#16a34a'; else if (statusV2.atrasado) colorP2 = '#dc2626'; }
                if (maxParcelas === 3) { if (pago_p3 >= (valBaseP3 - 0.1)) colorP3 = '#16a34a'; else if (statusV3.atrasado) colorP3 = '#dc2626'; }

                const txtP1 = pago_p1 >= (valBaseP1 - 0.1) ? 'PAGO ✓' : `R$ ${encargosP1.total.toFixed(2)}`;
                const txtP2 = maxParcelas >= 2 ? (pago_p2 >= (valBaseP2 - 0.1) ? 'PAGO ✓' : `R$ ${encargosP2.total.toFixed(2)}`) : '--';
                const txtP3 = maxParcelas === 3 ? (pago_p3 >= (valBaseP3 - 0.1) ? 'PAGO ✓' : `R$ ${encargosP3.total.toFixed(2)}`) : '--';

                let txtAlerta = '';
                if (statusV1.atrasado && pago_p1 < valBaseP1) {
                    txtAlerta = `⚠️ 1ª PARCELA ATRASADA: R$ ${encargosP1.devedorOriginal.toFixed(2)} + R$ ${encargosP1.multa} (Multa) + R$ ${encargosP1.juros.toFixed(2)} (Juros)`; 
                } else if (maxParcelas >= 2 && statusV2.atrasado && pago_p2 < valBaseP2) {
                    txtAlerta = `⚠️ 2ª PARCELA ATRASADA: R$ ${encargosP2.devedorOriginal.toFixed(2)} + R$ ${encargosP2.multa} (Multa) + R$ ${encargosP2.juros.toFixed(2)} (Juros)`; 
                } else if (maxParcelas === 3 && statusV3.atrasado && pago_p3 < valBaseP3) {
                    txtAlerta = `⚠️ 3ª PARCELA ATRASADA: R$ ${encargosP3.devedorOriginal.toFixed(2)} + R$ ${encargosP3.multa} (Multa) + R$ ${encargosP3.juros.toFixed(2)} (Juros)`; 
                } else {
                    if (maxParcelas === 1) txtAlerta = statusV1.texto;
                    else if (maxParcelas === 2) txtAlerta = pago_p1 >= valBaseP1 ? `${statusV2.texto} a 2ª parcela` : `${statusV1.texto} a 1ª parcela`;
                    else if (maxParcelas === 3) txtAlerta = pago_p1 >= valBaseP1 ? (pago_p2 >= valBaseP2 ? `${statusV3.texto} a 3ª parcela` : `${statusV2.texto} a 2ª parcela`) : `${statusV1.texto} a 1ª parcela`;
                }

                const dataEntregaFormatada = (pedido && pedido.data_entrega) ? formatarDataBR(pedido.data_entrega) : '--';

                const fullHTML = `
                    <div id="receipt-capture-area" style="width: 500px; padding: 40px; background: #ffffff; color: #1e293b; font-family: 'Arial', sans-serif; position: relative; border-top: 8px solid #07c2b2;">
                        <div style="text-align: center; margin-bottom: 30px;">
                            <h1 style="margin: 0; font-size: 26px; color: #0f172a; font-weight: 800; letter-spacing: -1px;">O BOTICÁRIO</h1>
                            <span style="font-size: 13px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;">Comprovante de Compra</span>
                        </div>
                        
                        <div style="background: #f8fafc; border-radius: 16px; padding: 20px; margin-bottom: 25px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px;">
                                <span style="color: #64748b; font-size:14px;">Cliente</span>
                                <strong style="color: #0f172a; font-size: 16px;">${cliente}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px;">
                                <span style="color: #64748b; font-size:14px;">Caixa Referência</span>
                                <strong style="color: #0f172a; font-size:14px;">#${codPedido}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <span style="color: #64748b; font-size:14px;">Previsão de Entrega</span>
                                <strong style="color: #0f172a; font-size:14px;">${dataEntregaFormatada}</strong>
                            </div>
                        </div>

                        <div style="margin-bottom: 25px;">
                            <h3 style="font-size: 14px; color: #64748b; text-transform: uppercase; margin-bottom: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px;">Itens do Pedido (${qtd})</h3>
                            ${htmlItens}
                        </div>

                        <div style="background: #f1f5f9; padding: 20px; border-radius: 16px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center;">
                                <span style="font-size: 16px; color: #0f172a; font-weight: bold;">TOTAL DA COMPRA</span>
                                <strong style="font-size: 22px; color: #07c2b2;">R$ ${totalVendaOriginal.toFixed(2)}</strong>
                            </div>
                            
                            <div style="background: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                    <span style="font-size:13px; color:#64748b;">1ª Parc (${venc1 ? formatarDataBR(venc1).substring(0, 5) : '--'}):</span>
                                    <strong style="font-size:14px; color:${colorP1};">${txtP1}</strong>
                                </div>
                                <div style="display: flex; justify-content: space-between; margin-bottom: ${maxParcelas === 3 ? '8px' : '0'};">
                                    <span style="font-size:13px; color:#64748b;">2ª Parc (${(maxParcelas >= 2 && venc2) ? formatarDataBR(venc2).substring(0, 5) : '--'}):</span>
                                    <strong style="font-size:14px; color:${colorP2};">${txtP2}</strong>
                                </div>
                                ${maxParcelas === 3 ? `
                                <div style="display: flex; justify-content: space-between;">
                                    <span style="font-size:13px; color:#64748b;">3ª Parc (${(maxParcelas === 3 && venc3) ? formatarDataBR(venc3).substring(0, 5) : '--'}):</span>
                                    <strong style="font-size:14px; color:${colorP3};">${txtP3}</strong>
                                </div>` : ''}
                            </div>

                            <div style="text-align: center; color: ${txtAlerta.includes('⚠️') ? '#dc2626' : '#64748b'}; font-size: 13px; font-weight: bold; margin-bottom: 15px;">
                                ${txtAlerta}
                            </div>

                            <div style="text-align: center; font-size: 10px; color: #94a3b8; line-height: 1.4;">
                                ATENÇÃO: A partir da data de vencimento, incidirá multa de R$ 5,93 e juros de R$ 0,89 ao dia a contar da data vcto.
                            </div>
                        </div>
                    </div>
                `;

                abrirModalPreviewImagem(fullHTML, cliente);

            } catch (err) {
                console.error("Erro crítico:", err);
                alert("Falha na formatação visual. Verifique a conexão.");
            } finally {
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        };

        window.abrirModalPreviewImagem = (fullHTML, clienteNome) => {
            let modal = document.getElementById('sys-img-preview-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'sys-img-preview-modal';
                modal.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:15px; backdrop-filter: blur(4px);';
                document.body.appendChild(modal);
            }

            modal.innerHTML = `
                <div style="background:#fff; width:100%; max-width:550px; border-radius:12px; display:flex; flex-direction:column; height:85vh; overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
                    <div style="padding:15px 20px; background:#f8f9fa; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; font-size:1.1rem; color:#333;"><i class="fa-solid fa-image" style="color:#07c2b2;"></i> Recibo Visual</h3>
                        <button onclick="document.getElementById('sys-img-preview-modal').style.display='none'" style="background:none; border:none; font-size:1.5rem; color:#666; cursor:pointer;">&times;</button>
                    </div>
                    
                    <div id="sys-img-scroll-area" style="flex:1; overflow-y:auto; background:#cbd5e1; display:flex; justify-content:center; align-items:flex-start;">
                        <div id="wrapper-capture-box" style="transform-origin: top center;">
                            ${fullHTML}
                        </div>
                    </div>

                    <div style="padding:15px; border-top:1px solid #ddd; display:flex; gap:10px; justify-content:space-between; background:#fff;">
                        <button id="btn-img-baixar" style="flex:1; padding:12px; background:#0f172a; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:0.95rem; display:flex; align-items:center; justify-content:center; gap:8px;">
                            <i class="fa-solid fa-download"></i> Salvar Imagem
                        </button>
                        <button id="btn-img-compartilhar" style="flex:1; padding:12px; background:#25D366; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:0.95rem; display:flex; align-items:center; justify-content:center; gap:8px;">
                            <i class="fa-brands fa-whatsapp"></i> Compartilhar
                        </button>
                    </div>
                </div>
            `;

            modal.style.display = 'flex';

            setTimeout(() => {
                const scrollArea = document.getElementById('sys-img-scroll-area');
                const wrapper = document.getElementById('wrapper-capture-box');
                const scale = scrollArea.clientWidth / 500;
                if(scale < 1) {
                    wrapper.style.transform = `scale(${scale})`;
                    wrapper.style.marginBottom = `-${wrapper.scrollHeight * (1 - scale)}px`;
                }
            }, 50);

            const dispararExportacaoImagem = async (acao, btnElement) => {
                const originalHTML = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';
                btnElement.disabled = true;

                try {
                    const html2canvasLib = await loadHtml2Canvas();
                    const captureArea = document.getElementById('receipt-capture-area');
                    
                    const canvas = await html2canvasLib(captureArea, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
                    const dataURL = canvas.toDataURL("image/png");

                    if (acao === 'share') {
                        canvas.toBlob(async (blob) => {
                            const file = new File([blob], `Recibo_${clienteNome.replace(/ /g, "_")}.png`, { type: 'image/png' });
                            if (navigator.share) {
                                await navigator.share({ title: `Recibo - ${clienteNome}`, files: [file] });
                            } else {
                                alert("Seu navegador não suporta compartilhamento direto. Baixe a imagem e envie manualmente.");
                            }
                        }, 'image/png');
                    } else {
                        const link = document.createElement("a");
                        link.download = `Recibo_${clienteNome.replace(/ /g, "_")}.png`;
                        link.href = dataURL;
                        link.click();
                    }
                } catch (err) {
                    console.error("Erro na renderização da imagem:", err);
                    alert("Falha ao desenhar a imagem. A sua conexão pode ter travado.");
                } finally {
                    btnElement.innerHTML = originalHTML;
                    btnElement.disabled = false;
                }
            };

            document.getElementById('btn-img-baixar').onclick = function() { dispararExportacaoImagem('download', this); };
            document.getElementById('btn-img-compartilhar').onclick = function() { dispararExportacaoImagem('share', this); };
        };

        carregarDadosCliente();
    </script>
</body>

</html>
